<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>JTP</title>
  <link rel="icon" href="image/logo.png">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.1/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/OwlCarousel2/2.3.4/assets/owl.carousel.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="style/style.css">
  <script src="components/site.js"></script>
</head>

<body>
  <site-header></site-header>
  <div class="contact">
    <div class="container">
      <div class="crumb">
        <a href="index.html">Trang chủ</a>
        <span class="sep">/</span>
        <span class="here">Liên hệ</span>
      </div>
      <h1>Chúng tôi ở đây để lắng nghe</h1>
      <span class="sub">Chương trình liên kết đào tạo</span>
      <div class="line"></div>
      <div class="row info">
        <div class="col-12 col-lg-5">
          <div class="item">
            <img src="image/svg/contact-phone.svg" alt="">
            <div class="copy">
              <span>Hotline</span>
              <a href="tel:0904509769">0904 509 769 - 0339 866 406</a>
            </div>
          </div>
          <div class="item">
            <div class="ico">
              <img src="image/svg/contact-mail.svg" alt="">
            </div>
            <div class="copy">
              <span>Email</span>
              <a href="mailto:Lienketdaotaohvng@dav.edu.vn">Lienketdaotaohvng@dav.edu.vn →</a>
            </div>
          </div>
          <div class="social">
            <a class="fb" href="#"><img src="image/svg/contact-facebook.svg" alt="Facebook"></a>
            <a href="#"><img src="image/svg/contact-tiktok.svg" alt="TikTok"></a>
            <a href="#"><img src="image/svg/contact-youtube.svg" alt="YouTube"></a>
          </div>
        </div>
        <div class="col-12 col-lg-4">
          <div class="place">
            <span>Địa chỉ</span>
            <span class="city">Thành Phố Hà Nội</span>
            <span class="street">69 Chùa Láng, Láng Thượng, Đống Đa, Hà Nội</span>
          </div>
        </div>
        <div class="col-12 col-lg-3">
          <div class="map">
            <a class="goto" href="https://www.google.com/maps/search/?api=1&amp;query=69%20Ch%C3%B9a%20L%C3%A1ng%2C%20L%C3%A1ng%20Th%C6%B0%E1%BB%A3ng%2C%20%C4%90%E1%BB%91ng%20%C4%90a%2C%20H%C3%A0%20N%E1%BB%99i">XEM TRÊN BẢN ĐỒ →</a>
          </div>
        </div>
      </div>
    </div>
  </div>
  <div class="ask">
    <div class="container">
      <div class="head">
                <h2 class="title"><span class="part">Đăng ký nhận</span><span class="title-red">thông tin tuyển sinh</span></h2>
            </div>
      <div class="row">
        <div class="col-12 col-lg-7">
          <form action="#" method="post">
            <div class="mark">
              <img src="image/jtp-mark.png" alt="">
            </div>
            <h2>Điền thông tin của bạn</h2>
            <div class="row">
              <div class="col-12 col-md-6">
                <label for="news-who">Người đăng ký tư vấn <span>*</span></label>
                <div class="pick">
                  <select id="news-who" name="who" required>
                    <option value="" selected disabled>Phụ huynh / Học sinh</option>
                    <option>Phụ huynh</option>
                    <option>Học sinh</option>
                  </select>
                  <span><img src="image/svg/expand-right.svg" alt=""></span>
                </div>
              </div>
              <div class="col-12 col-md-6">
                <label for="news-name">Họ tên người đăng ký tư vấn <span>*</span></label>
                <input id="news-name" type="text" name="name" placeholder="Nguyen Minh Phuc" required>
              </div>
            </div>
            <div class="row">
              <div class="col-12 col-md-6">
                <label for="news-phone">Số điện thoại <span>*</span></label>
                <input id="news-phone" type="tel" name="phone" placeholder="3256xxxxxxx" required>
              </div>
              <div class="col-12 col-md-6">
                <label for="news-email">Email <span>*</span></label>
                <input id="news-email" type="email" name="email" placeholder="username@gmail.com" required>
              </div>
            </div>
            <div class="row">
              <div class="col-12 col-md-6">
                <label for="news-school">Chọn trường liên kết <span>*</span></label>
                <div class="pick">
                  <select id="news-school" name="school" required>
                    <option value="" selected disabled>Victoria Wellington - New Zealand</option>
                    <option>Victoria Wellington - New Zealand</option>
                    <option>Monash University</option>
                    <option>Macquarie University</option>
                    <option>Flinders University</option>
                  </select>
                  <span><img src="image/svg/expand-right.svg" alt=""></span>
                </div>
              </div>
              <div class="col-12 col-md-6">
                <label for="news-major">Chọn ngành học mong muốn <span>*</span></label>
                <div class="pick">
                  <select id="news-major" name="major" required>
                    <option value="" selected disabled>Ngành Quan hệ quốc tế</option>
                    <option>Ngành Quan hệ quốc tế</option>
                    <option>Ngành Thương mại</option>
                  </select>
                  <span><img src="image/svg/expand-right.svg" alt=""></span>
                </div>
              </div>
            </div>
            <label for="news-note">Nội dung cần tư vấn</label>
            <textarea id="news-note" name="note" placeholder="Nội dung bạn cần chúng tôi tư vấn"></textarea>
            <button type="submit" class="btn lg">Đăng ký ngay</button>
          </form>
        </div>
        <div class="col-12 col-lg-5 shot">
          <img src="image/enroll.jpg" alt="Sinh viên JTP" class="w-100">
        </div>
      </div>
    </div>
  </div>
  <site-footer></site-footer>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.1/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/OwlCarousel2/2.3.4/owl.carousel.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/waypoints/4.0.1/jquery.waypoints.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Counter-Up/1.0.0/jquery.counterup.min.js"></script>
  <script src="js/main.js?v=menu8"></script>
</body>

</html>
